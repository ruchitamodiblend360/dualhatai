<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status Generator — Blend PM Tools</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0B0D0E; padding: 24px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; }
    #root { max-width: 1100px; margin: 0 auto; }
    .ld-footer {
      max-width: 1100px;
      margin: 32px auto 0;
      padding: 16px 0 20px;
      border-top: 1px solid #314550;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ld-word { font-size: 18px; font-weight: 500; color: #F4F3F0; letter-spacing: 0.01em; }
    .ld-word .dot { color: #00EDED; }
    .ld-powered { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #314550; }
    .ld-blendmark { height: 18px; width: auto; opacity: 0.85; }
    @keyframes spin  { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
    button:not(:disabled):hover { opacity: 0.88; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #0B0D0E; } ::-webkit-scrollbar-thumb { background: #314550; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    function showError(title, detail) {
      var r = document.getElementById("root");
      if (r) r.innerHTML = '<div style="max-width:760px;margin:40px auto;padding:20px 24px;border:1px solid #7F1D1D;background:#1a0808;border-radius:12px;font-family:sans-serif;color:#FCA5A5"><div style="font-weight:600;font-size:15px;margin-bottom:8px">' + title + '</div><pre style="white-space:pre-wrap;font-size:12px;margin:0;color:#fecaca">' + detail + '</pre></div>';
    }
    window.addEventListener("error", function(e) { showError("Script error", (e.message||e.error||e)+"\n"+(e.filename||"")); });
    window.addEventListener("unhandledrejection", function(e) { showError("Promise rejection", (e.reason&&e.reason.message)||e.reason||"unknown"); });
  </script>

  <script type="text/plain" id="app-src">
    const { useState, useEffect } = React;

    async function generatePptx(deck) {
      const resp = await fetch("/api/export-pptx", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(deck),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(function() { return { error: resp.statusText }; });
        throw new Error(err.error || resp.statusText);
      }
      const blob = await resp.blob();
      const fn = ((deck.projectName || "status") + "-status-deck").replace(/[^a-zA-Z0-9\-]/g, "-") + ".pptx";
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fn;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function StatusGenerator() {
      const [boards, setBoards]                 = useState([]);
      const [loading, setLoading]               = useState(true);
      const [loadErr, setLoadErr]               = useState("");
      const [selectedBoard, setSelectedBoard]   = useState(null);
      const [selectedSprint, setSelectedSprint] = useState(null);
      const [generating, setGenerating]         = useState(false);
      const [deck, setDeck]                     = useState(null);
      const [genError, setGenError]             = useState("");
      const [exporting, setExporting]           = useState(false);

      useEffect(function() {
        fetch("/api/jira/board-overview")
          .then(function(r) { return r.json(); })
          .then(function(d) { setBoards(Array.isArray(d) ? d : []); setLoading(false); })
          .catch(function(e) { setLoadErr(e.message); setLoading(false); });
      }, []);

      const AVATAR_COLORS = ["#053057","#5B21B6","#065F46","#92400E","#1E40AF","#7C3AED","#0F766E","#B45309"];
      function avatarColor(key) {
        var h = 0;
        for (var i = 0; i < (key || "").length; i++) h = (h * 31 + key.charCodeAt(i)) & 0xFFFFFF;
        return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
      }
      function initials(name) {
        return (name || "?").split(/\s+/).slice(0, 2).map(function(w) { return w[0]; }).join("").toUpperCase();
      }

      function generate() {
        if (!selectedBoard || !selectedSprint) return;
        setGenerating(true); setGenError(""); setDeck(null);
        fetch("/api/status-deck", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            boardId:     selectedBoard.id,
            sprintId:    selectedSprint.id || null,
            isBacklog:   selectedSprint.type === "backlog",
            projectName: selectedBoard.projectName || selectedBoard.name,
            sprintName:  selectedSprint.name,
            sprintStart: selectedSprint.startDate || "",
            sprintEnd:   selectedSprint.endDate   || "",
          })
        })
        .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
        .then(function(res) {
          if (!res.ok || res.data.error) {
            var key = res.data.error || "unknown";
            setGenError(key === "rate_limited" ? "rate_limited" : key);
          } else {
            setDeck(res.data);
          }
          setGenerating(false);
        })
        .catch(function(e) { setGenError(e.message); setGenerating(false); });
      }

      function handleExport() {
        if (!deck) return;
        setExporting(true);
        generatePptx(deck)
          .catch(function(e) { alert("PPTX export failed: " + e.message); })
          .finally(function() { setExporting(false); });
      }

      function SprintBar() {
        if (!selectedBoard) return null;
        const sprints = selectedBoard.sprints || [];
        return (
          <div style={{ background: "#1A1A1A", borderBottom: "1px solid #314550" }}>
            {/* Sprint selection row */}
            <div style={{ padding: "14px 20px 10px", display: "flex", flexWrap: "wrap", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 13, fontWeight: 600, color: "#A2F3F3", flexShrink: 0, marginRight: 4 }}>
                {selectedBoard.projectName || selectedBoard.name}
              </span>
              {sprints.map(function(sprint) {
                const isActive = sprint.state === "active";
                const isSel    = selectedSprint && selectedSprint.id === sprint.id;
                return (
                  <button key={sprint.id}
                    onClick={function() { setSelectedSprint(Object.assign({}, sprint, { type: "sprint" })); setDeck(null); }}
                    style={{ padding: "5px 13px", borderRadius: 99, fontSize: 12, cursor: "pointer",
                      border: isSel ? "2px solid #00EDED" : isActive ? "1.5px solid #053057" : "1px solid #314550",
                      background: isSel ? "#053057" : "transparent",
                      color: isSel ? "#FFFFFF" : isActive ? "#A2F3F3" : "#F4F3F0",
                      fontWeight: isSel ? 700 : isActive ? 500 : 400 }}>
                    {isActive && !isSel && <span style={{ fontSize: 8, padding: "1px 5px", borderRadius: 99, background: "#053057", color: "#A2F3F3", marginRight: 5, fontWeight: 700 }}>ACTIVE</span>}
                    {sprint.name}
                  </button>
                );
              })}
              {deck && !generating && (
                <button onClick={function() { setDeck(null); setSelectedBoard(null); setSelectedSprint(null); }}
                  style={{ marginLeft: "auto", padding: "6px 12px", borderRadius: 8, border: "1px solid #314550", background: "transparent",
                    color: "#A2F3F3", fontSize: 12, cursor: "pointer" }}>
                  <i className="ti ti-arrow-left" style={{ marginRight: 4 }} /> Change Board
                </button>
              )}
            </div>
          </div>
        );
      }

      function BoardGrid() {
        const [boardPage, setBoardPage] = React.useState(1);
        const [search, setSearch] = React.useState("");
        const BOARD_PAGE_SIZE = 24;
        const filteredBoards = (boards || []).filter(function(b) { return (b.projectName || b.name || "").toLowerCase().includes(search.toLowerCase()); });
        const totalBoardPages = Math.ceil(filteredBoards.length / BOARD_PAGE_SIZE);
        const pagedBoards = filteredBoards.slice((boardPage - 1) * BOARD_PAGE_SIZE, boardPage * BOARD_PAGE_SIZE);

        if (loading) return (
          <div style={{ padding: "60px 24px", textAlign: "center", color: "#A2F3F3", fontSize: 14 }}>
            <i className="ti ti-loader-2" style={{ fontSize: 32, display: "block", marginBottom: 12, animation: "spin 1s linear infinite", color: "#00EDED" }} />
            Loading Jira boards...
          </div>
        );
        if (loadErr) return (
          <div style={{ padding: "60px 24px", textAlign: "center", color: "#FCA5A5", fontSize: 13 }}>
            <i className="ti ti-alert-triangle" style={{ fontSize: 32, display: "block", marginBottom: 12, color: "#F87171" }} />
            {loadErr}
          </div>
        );

        function selectRow(board, sprintObj) {
          setSelectedBoard(board);
          setSelectedSprint(sprintObj);
          setDeck(null);
        }

        return (
          <div style={{ padding: "24px 20px 28px", background: "#ffffff" }}>
            <h2 style={{ fontSize: 17, fontWeight: 500, color: "#053057", margin: "0 0 5px" }}>Select a project board</h2>
            <p style={{ fontSize: 13, color: "#314550", margin: "0 0 14px" }}>
              Pick a sprint to generate an executive status deck with AI.
            </p>
            <div style={{ position: "relative", marginBottom: 20 }}>
              <i className="ti ti-search" style={{ position: "absolute", left: 11, top: "50%", transform: "translateY(-50%)", color: "#314550", fontSize: 14, pointerEvents: "none" }} />
              <input
                type="text"
                placeholder="Search projects…"
                value={search}
                onChange={function(e) { setSearch(e.target.value); setBoardPage(1); }}
                style={{ width: "100%", boxSizing: "border-box", padding: "9px 32px 9px 32px", borderRadius: 8,
                  border: "0.5px solid #314550", background: "#ffffff", color: "#053057",
                  fontSize: 13, outline: "none" }}
                onFocus={function(e) { e.target.style.borderColor = "#053057"; }}
                onBlur={function(e) { e.target.style.borderColor = "#314550"; }}
              />
              {search && (
                <button onClick={function() { setSearch(""); setBoardPage(1); }}
                  style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)",
                    background: "none", border: "none", cursor: "pointer", color: "#314550", fontSize: 16, lineHeight: 1, padding: 0, zIndex: 2 }}>×</button>
              )}
            </div>
            <SprintBar />
            {/* Generate bar — shown when a sprint is selected, above the board grid */}
            {selectedSprint && !deck && (
              <div style={{ marginBottom: 16, padding: "12px 16px", borderRadius: 10,
                background: "#053057", border: "1px solid #00EDED33",
                display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
                  <i className="ti ti-calendar-event" style={{ color: "#A2F3F3", fontSize: 14, flexShrink: 0 }} />
                  <span style={{ fontSize: 13, color: "#F4F3F0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                    {(selectedBoard.projectName || selectedBoard.name)} &middot; {selectedSprint.name}
                  </span>
                </div>
                <button onClick={generate} disabled={generating}
                  style={{ marginLeft: "auto", padding: "8px 22px", borderRadius: 8,
                    background: generating ? "#314550" : "#00EDED",
                    border: "none", color: generating ? "#F4F3F0" : "#053057",
                    fontSize: 13, fontWeight: 700, cursor: generating ? "not-allowed" : "pointer",
                    display: "flex", alignItems: "center", gap: 7, flexShrink: 0 }}>
                  {generating
                    ? <span><i className="ti ti-loader-2" style={{ animation: "spin 1s linear infinite", marginRight: 6 }} />Generating...</span>
                    : <span><i className="ti ti-sparkles" style={{ marginRight: 6 }} />Generate Draft Status Deck</span>}
                </button>
              </div>
            )}
            {genError && (
              <div style={{ marginBottom: 14, padding: "12px 16px", borderRadius: 8, fontSize: 13,
                background: genError === "rate_limited" ? "#FFFBEB" : "#FEF2F2",
                border: genError === "rate_limited" ? "1px solid #F59E0B" : "1px solid #EF4444",
                color: genError === "rate_limited" ? "#92400E" : "#7F1D1D",
                display: "flex", alignItems: "flex-start", gap: 9 }}>
                <i className={`ti ${genError === "rate_limited" ? "ti-clock-pause" : "ti-alert-circle"}`}
                  style={{ fontSize: 16, marginTop: 1, flexShrink: 0 }} />
                <div>
                  <div style={{ fontWeight: 600, marginBottom: 3 }}>
                    {genError === "rate_limited" ? "AI rate limit reached" : "Generation failed"}
                  </div>
                  <div style={{ lineHeight: 1.5 }}>
                    {genError === "rate_limited"
                      ? "The AI service is temporarily limiting requests. Wait a moment and try again."
                      : genError}
                  </div>
                </div>
              </div>
            )}
            {filteredBoards.length === 0 && search && (
              <div style={{ textAlign: "center", padding: "40px 0", color: "#314550", fontSize: 13 }}>
                No projects match "<span style={{ color: "#A2F3F3" }}>{search}</span>"
              </div>
            )}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 12 }}>
              {pagedBoards.map(function(board) {
                const color = avatarColor(board.projectKey || board.name);
                return (
                  <div key={board.id} style={{ border: "1px solid #314550", borderRadius: 10, overflow: "hidden", background: "#1A1A1A" }}>
                    <div style={{ padding: "13px 15px 10px", borderBottom: "1px solid #314550", display: "flex", alignItems: "center", gap: 9 }}>
                      <div style={{ width: 32, height: 32, borderRadius: 8, background: color, flexShrink: 0,
                        display: "flex", alignItems: "center", justifyContent: "center",
                        fontSize: 12, fontWeight: 700, color: "#fff" }}>{initials(board.projectName || board.name)}</div>
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, color: "#fff", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{board.projectName || board.name}</div>
                        <div style={{ fontSize: 11, color: "#F4F3F0", marginTop: 1 }}>
                          {board.sprints.length} sprint{board.sprints.length !== 1 ? "s" : ""}
                        </div>
                      </div>
                    </div>
                    <div style={{ padding: "8px" }}>
                      {board.sprints.map(function(sprint) {
                        const isActive  = sprint.state === "active";
                        const isClosed  = sprint.state === "closed";
                        const isSelRow  = selectedBoard && selectedBoard.id === board.id && selectedSprint && selectedSprint.id === sprint.id;
                        return (
                          <div key={sprint.id} onClick={function() { selectRow(board, Object.assign({}, sprint, { type: "sprint" })); }}
                            style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                              padding: "9px 10px", borderRadius: 7, cursor: "pointer", marginBottom: 4,
                              border: isSelRow ? "1.5px solid #00EDED" : isActive ? "1.5px solid #00EDED" : isClosed ? "1px solid #314550" : "1px solid #314550",
                              background: isSelRow ? "#053057" : isActive ? "#053057" : "transparent",
                              opacity: isClosed ? 0.75 : 1,
                              transition: "background 120ms" }}
                            onMouseEnter={function(e) { if (!isSelRow && !isActive) e.currentTarget.style.background = "#053057"; }}
                            onMouseLeave={function(e) { if (!isSelRow && !isActive) e.currentTarget.style.background = "transparent"; }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 7, minWidth: 0 }}>
                              <i className={isClosed ? "ti ti-circle-check" : "ti ti-refresh"}
                                style={{ fontSize: 13, color: isActive ? "#00EDED" : isClosed ? "#6B7280" : "#A2F3F3", flexShrink: 0 }} />
                              <span style={{ fontSize: 13, color: isActive ? "#00EDED" : isClosed ? "#9CA3AF" : "#F4F3F0", fontWeight: isActive ? 500 : 400,
                                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{sprint.name}</span>
                              {isActive && <span style={{ fontSize: 9, padding: "1px 6px", borderRadius: 99, flexShrink: 0,
                                background: "#00EDED", color: "#053057", fontWeight: 700, letterSpacing: "0.05em" }}>Active</span>}
                              {isClosed && <span style={{ fontSize: 9, padding: "1px 6px", borderRadius: 99, flexShrink: 0,
                                background: "#374151", color: "#9CA3AF", fontWeight: 600, letterSpacing: "0.05em" }}>Completed</span>}
                            </div>
                            <span style={{ fontSize: 11, color: isClosed ? "#6B7280" : "#F4F3F0", flexShrink: 0, marginLeft: 8 }}>{sprint.count} {sprint.count === 1 ? "story" : "stories"}</span>
                          </div>
                        );
                      })}
                      {board.backlogCount === 0 && board.sprints.length === 0 && (
                        <div style={{ padding: "10px", fontSize: 12, color: "#F4F3F0", textAlign: "center" }}>No stories</div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
            {totalBoardPages > 1 && (
              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, paddingTop: 20 }}>
                <button onClick={function() { setBoardPage(function(p) { return Math.max(1, p - 1); }); }} disabled={boardPage === 1}
                  style={{ padding: "5px 10px", fontSize: 12, border: "0.5px solid #314550", borderRadius: 6,
                    background: "none", cursor: boardPage === 1 ? "default" : "pointer",
                    color: boardPage === 1 ? "#314550" : "#A2F3F3" }}>‹ Prev</button>
                {Array.from({ length: totalBoardPages }, function(_, ii) { return ii + 1; }).map(function(p) {
                  return (
                    <button key={p} onClick={function() { setBoardPage(p); }}
                      style={{ padding: "5px 9px", fontSize: 12, border: "0.5px solid #314550", borderRadius: 6,
                        cursor: "pointer", background: p === boardPage ? "#053057" : "#1A1A1A",
                        color: p === boardPage ? "#FFFFFF" : "#A2F3F3" }}>{p}</button>
                  );
                })}
                <button onClick={function() { setBoardPage(function(p) { return Math.min(totalBoardPages, p + 1); }); }} disabled={boardPage === totalBoardPages}
                  style={{ padding: "5px 10px", fontSize: 12, border: "0.5px solid #314550", borderRadius: 6,
                    background: "none", cursor: boardPage === totalBoardPages ? "default" : "pointer",
                    color: boardPage === totalBoardPages ? "#314550" : "#A2F3F3" }}>Next ›</button>
              </div>
            )}
          </div>
        );
      }

      function DeckView(props) {
        const d = props.d;
        const onBack = props.onBack;
        // Local editable copy — isolated from parent so typing doesn't trigger re-renders
        const [local, setLocal] = React.useState(d);
        const [exporting, setExporting] = React.useState(false);
        function update(patch) {
          setLocal(function(prev) { return Object.assign({}, prev, patch); });
        }
        function handleExportLocal() {
          setExporting(true);
          generatePptx(local)
            .catch(function(e) { alert("PPTX export failed: " + e.message); })
            .finally(function() { setExporting(false); });
        }
        const hcfg = ({
          "On Track":  { bg: "#0B0D0E", border: "#065F46", text: "#6EE7B7", icon: "ti-circle-check" },
          "At Risk":   { bg: "#1A1A1A", border: "#B45309", text: "#FCD34D", icon: "ti-alert-triangle" },
          "Off Track": { bg: "#1A1A1A", border: "#7F1D1D", text: "#F87171", icon: "ti-circle-x" },
        })[d.healthStatus] || { bg: "#1A1A1A", border: "#B45309", text: "#FCD34D", icon: "ti-alert-triangle" };

        const m = d.metrics || {};
        const compPct = m.completionPct || 0;

        return (
          <div style={{ padding: "20px" }}>
            {/* Back button */}
            <button onClick={onBack}
              style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 14,
                padding: "7px 14px", borderRadius: 8, border: "1px solid #314550",
                background: "transparent", color: "#A2F3F3", fontSize: 13, cursor: "pointer" }}>
              <i className="ti ti-arrow-left" style={{ fontSize: 14 }} /> Back to projects
            </button>
            {/* Draft banner */}
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14,
              padding: "8px 14px", borderRadius: 8,
              background: "rgba(251,191,36,0.08)", border: "1px solid rgba(251,191,36,0.3)" }}>
              <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: "0.12em",
                padding: "2px 8px", borderRadius: 4,
                background: "rgba(251,191,36,0.18)", color: "#FCD34D", border: "1px solid rgba(251,191,36,0.4)" }}>
                DRAFT
              </span>
              <span style={{ fontSize: 12, color: "#FCD34D", opacity: 0.8 }}>
                AI-generated content — review and edit before sharing externally.
              </span>
            </div>
            {/* Header */}
            <div style={{ background: "#053057", borderRadius: 12, padding: "18px 22px", marginBottom: 16, display: "flex", alignItems: "flex-start", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
              <div>
                <div style={{ fontSize: 10, fontWeight: 700, color: "#00EDED", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 5 }}>Sprint Status Update</div>
                <div style={{ fontSize: 22, fontWeight: 700, color: "#fff" }}>{d.projectName}</div>
                <div style={{ fontSize: 13, color: "#A2F3F3", marginTop: 4 }}>{d.sprintName} &middot; {d.weekOf}</div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 16px", borderRadius: 99,
                  background: hcfg.bg, border: "1.5px solid " + hcfg.border, color: hcfg.text, fontWeight: 700, fontSize: 13 }}>
                  <i className={"ti " + hcfg.icon} />{d.healthStatus}
                </div>
                <button onClick={handleExportLocal} disabled={exporting}
                  style={{ padding: "9px 18px", borderRadius: 8, border: "1.5px solid #00EDED",
                    background: exporting ? "#314550" : "#053057", color: "#FFFFFF",
                    fontSize: 13, fontWeight: 700, cursor: exporting ? "not-allowed" : "pointer",
                    display: "flex", alignItems: "center", gap: 7 }}>
                  {exporting
                    ? <span><i className="ti ti-loader-2" style={{ animation: "spin 1s linear infinite", marginRight: 6 }} />Generating PPTX...</span>
                    : <span><i className="ti ti-file-export" style={{ marginRight: 6 }} />Export as PPTX</span>}
                </button>
              </div>
            </div>

            {/* Executive Summary */}
            <div style={{ background: "#1A1A1A", border: "1px solid #314550", borderRadius: 10, padding: "15px 18px", marginBottom: 14 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: "#00EDED", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 9, display: "flex", alignItems: "center", gap: 6 }}>
                Executive Summary
                <i className="ti ti-pencil" style={{ fontSize: 11, color: "#314550" }} />
              </div>
              <textarea
                value={local.executiveSummary || ""}
                onChange={function(e) { update({ executiveSummary: e.target.value }); }}
                rows={3}
                style={{ width: "100%", boxSizing: "border-box", background: "transparent", border: "none", outline: "none",
                  resize: "vertical", fontSize: 14, color: "#F4F3F0", lineHeight: 1.7, fontFamily: "inherit", padding: 0 }}
              />
            </div>

            {/* Metrics */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(110px, 1fr))", gap: 8, marginBottom: 14 }}>
              {[
                { label: "Total",       value: m.totalIssues,       icon: "ti-list",         color: "#fff" },
                { label: "Completed",   value: m.doneIssues,        icon: "ti-circle-check", color: "#6EE7B7" },
                { label: "In Progress", value: m.inProgressIssues,  icon: "ti-loader-2",     color: "#FCD34D" },
                { label: "Completion",  value: compPct + "%",       icon: "ti-chart-pie",    color: compPct >= 60 ? "#6EE7B7" : compPct >= 40 ? "#FCD34D" : "#F87171" },
              ].map(function(stat) {
                return (
                  <div key={stat.label} style={{ background: "#1A1A1A", border: "1px solid #314550", borderRadius: 8, padding: "11px 13px" }}>
                    <div style={{ fontSize: 10, color: "#A2F3F3", marginBottom: 5, display: "flex", alignItems: "center", gap: 4 }}>
                      <i className={"ti " + stat.icon} style={{ fontSize: 12 }} />{stat.label}
                    </div>
                    <div style={{ fontSize: 22, fontWeight: 700, color: stat.color }}>{stat.value}</div>
                  </div>
                );
              })}
            </div>

            {/* Progress bar */}
            <div style={{ marginBottom: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5, fontSize: 11, color: "#A2F3F3" }}>
                <span>Sprint completion</span><span style={{ color: "#00EDED", fontWeight: 700 }}>{compPct}%</span>
              </div>
              <div style={{ height: 6, background: "#314550", borderRadius: 99, overflow: "hidden" }}>
                <div style={{ height: "100%", width: compPct + "%", background: "linear-gradient(90deg, #053057, #00EDED)", borderRadius: 99 }} />
              </div>
            </div>

            {/* Accomplishments + Next Steps */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 14 }}>
              <div style={{ border: "1px solid #314550", borderRadius: 10, overflow: "hidden" }}>
                <div style={{ padding: "11px 15px", background: "#053057", display: "flex", alignItems: "center", gap: 8 }}>
                  <i className="ti ti-circle-check" style={{ color: "#A2F3F3", fontSize: 14 }} />
                  <span style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>Key Accomplishments</span>
                  <span style={{ marginLeft: "auto", fontSize: 11, background: "#00EDED22", color: "#A2F3F3", padding: "1px 7px", borderRadius: 99 }}>{(d.accomplishments || []).length}</span>
                </div>
                <div style={{ padding: "6px", background: "#0B0D0E" }}>
                  {(local.accomplishments || []).length === 0
                    ? <div style={{ padding: "18px", fontSize: 13, color: "#A2F3F3", textAlign: "center" }}>No completed items</div>
                    : (local.accomplishments || []).map(function(a, i) {
                      return (
                        <div key={i} style={{ display: "flex", alignItems: "center", gap: 9, padding: "7px 10px", borderRadius: 7, marginBottom: 2, background: i % 2 === 0 ? "#1A1A1A" : "#0B0D0E" }}>
                          <i className="ti ti-check" style={{ color: "#00EDED", fontSize: 12, flexShrink: 0 }} />
                          <input
                            value={a.sentence || a.title || ""}
                            onChange={function(e) {
                              var next = (local.accomplishments || []).map(function(item, j) {
                                return j === i ? Object.assign({}, item, { sentence: e.target.value, title: e.target.value }) : item;
                              });
                              update({ accomplishments: next });
                            }}
                            style={{ flex: 1, background: "transparent", border: "none", outline: "none",
                              fontSize: 13, color: "#F4F3F0", fontFamily: "inherit", padding: 0 }}
                          />
                          <button onClick={function() {
                            update({ accomplishments: (local.accomplishments || []).filter(function(_, j) { return j !== i; }) });
                          }} style={{ background: "none", border: "none", cursor: "pointer", color: "#6b7280", padding: 0, lineHeight: 1 }} title="Remove">
                            <i className="ti ti-x" style={{ fontSize: 11 }} />
                          </button>
                        </div>
                      );
                    })
                  }
                  <button onClick={function() {
                    update({ accomplishments: (local.accomplishments || []).concat([{ sentence: "", title: "" }]) });
                  }} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4, padding: "5px 10px", background: "none", border: "1px dashed #314550", borderRadius: 7, cursor: "pointer", color: "#A2F3F3", fontSize: 12, width: "100%" }}>
                    <i className="ti ti-plus" style={{ fontSize: 12 }} /> Add item
                  </button>
                </div>
              </div>

              <div style={{ border: "1px solid #314550", borderRadius: 10, overflow: "hidden" }}>
                <div style={{ padding: "11px 15px", background: "#053057", display: "flex", alignItems: "center", gap: 8 }}>
                  <i className="ti ti-arrow-right-circle" style={{ color: "#A2F3F3", fontSize: 14 }} />
                  <span style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>Next Steps</span>
                  <span style={{ marginLeft: "auto", fontSize: 11, background: "#00EDED22", color: "#A2F3F3", padding: "1px 7px", borderRadius: 99 }}>{(d.nextSteps || []).length}</span>
                </div>
                <div style={{ padding: "6px", background: "#0B0D0E" }}>
                  {(local.nextSteps || []).length === 0
                    ? <div style={{ padding: "18px", fontSize: 13, color: "#A2F3F3", textAlign: "center" }}>No action items</div>
                    : (local.nextSteps || []).map(function(s, i) {
                      return (
                        <div key={i} style={{ display: "flex", alignItems: "center", gap: 7, padding: "7px 10px", borderRadius: 7, marginBottom: 2, background: i % 2 === 0 ? "#1A1A1A" : "#0B0D0E" }}>
                          <i className="ti ti-arrow-right" style={{ color: "#A2F3F3", fontSize: 12, flexShrink: 0 }} />
                          <input
                            value={s.action || ""}
                            onChange={function(e) {
                              var next = (local.nextSteps || []).map(function(item, j) {
                                return j === i ? Object.assign({}, item, { action: e.target.value }) : item;
                              });
                              update({ nextSteps: next });
                            }}
                            style={{ flex: 1, background: "transparent", border: "none", outline: "none",
                              fontSize: 13, color: "#F4F3F0", fontFamily: "inherit", padding: 0 }}
                          />
                          <button onClick={function() {
                            update({ nextSteps: (local.nextSteps || []).filter(function(_, j) { return j !== i; }) });
                          }} style={{ background: "none", border: "none", cursor: "pointer", color: "#6b7280", padding: 0, lineHeight: 1 }} title="Remove">
                            <i className="ti ti-x" style={{ fontSize: 11 }} />
                          </button>
                        </div>
                      );
                    })
                  }
                  <button onClick={function() {
                    update({ nextSteps: (local.nextSteps || []).concat([{ action: "" }]) });
                  }} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4, padding: "5px 10px", background: "none", border: "1px dashed #314550", borderRadius: 7, cursor: "pointer", color: "#A2F3F3", fontSize: 12, width: "100%" }}>
                    <i className="ti ti-plus" style={{ fontSize: 12 }} /> Add item
                  </button>
                </div>
              </div>
            </div>

            {/* Blockers */}
            <div style={{ border: "1px solid #7F1D1D", borderRadius: 10, overflow: "hidden", marginBottom: 14 }}>
                <div style={{ padding: "11px 15px", background: "#450a0a", display: "flex", alignItems: "center", gap: 8 }}>
                  <i className="ti ti-alert-triangle" style={{ color: "#FCA5A5", fontSize: 14 }} />
                  <span style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>Issues, Blockers &amp; Risks</span>
                  <span style={{ marginLeft: "auto", fontSize: 11, color: "#FCA5A5", background: "#7F1D1D44", padding: "1px 7px", borderRadius: 99 }}>{(local.blockers || []).length}</span>
                </div>
                <div style={{ padding: "8px", background: "#0B0D0E" }}>
                  {(local.blockers || []).length === 0
                    ? <div style={{ padding: "18px", fontSize: 13, color: "#FCA5A5", textAlign: "center" }}>No blockers</div>
                    : (local.blockers || []).map(function(b, i) {
                    const ic = ({ High: { bg: "#1A1A1A", border: "#F87171", text: "#F87171" }, Medium: { bg: "#1A1A1A", border: "#FCD34D", text: "#FCD34D" }, Low: { bg: "#0B0D0E", border: "#6EE7B7", text: "#6EE7B7" } })[b.impact] || { bg: "#1A1A1A", border: "#FCD34D", text: "#FCD34D" };
                    return (
                      <div key={i} style={{ padding: "12px 14px", borderRadius: 8, marginBottom: 6, background: ic.bg, border: "1px solid " + ic.border + "50" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
                          <i className="ti ti-circle-x" style={{ color: ic.text, fontSize: 14, flexShrink: 0 }} />
                          <input
                            value={b.title || ""}
                            onChange={function(e) {
                              var next = (local.blockers || []).map(function(item, j) {
                                return j === i ? Object.assign({}, item, { title: e.target.value }) : item;
                              });
                              update({ blockers: next });
                            }}
                            style={{ flex: 1, background: "transparent", border: "none", outline: "none",
                              fontSize: 13, fontWeight: 600, color: "#fff", fontFamily: "inherit", padding: 0 }}
                          />
                          <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 99, fontWeight: 700, background: ic.text + "30", color: ic.text, flexShrink: 0 }}>{b.impact}</span>
                          {b.type && <span style={{ fontSize: 10, padding: "2px 7px", borderRadius: 99, fontWeight: 600, background: "#314550", color: "#A2F3F3", flexShrink: 0 }}>{b.type}</span>}
                          <button onClick={function() {
                            update({ blockers: (local.blockers || []).filter(function(_, j) { return j !== i; }) });
                          }} style={{ background: "none", border: "none", cursor: "pointer", color: "#6b7280", padding: 0, lineHeight: 1 }} title="Remove">
                            <i className="ti ti-x" style={{ fontSize: 11 }} />
                          </button>
                        </div>
                        {b.mitigation && <div style={{ fontSize: 12, color: "#A2F3F3", marginLeft: 22 }}>Mitigation: {b.mitigation}</div>}
                        {b.owner && <div style={{ fontSize: 11, color: "#A2F3F3", marginLeft: 22, marginTop: 3 }}>Owner: {b.owner}</div>}
                      </div>
                    );
                  })}
                  <button onClick={function() {
                    update({ blockers: (local.blockers || []).concat([{ title: "", impact: "Medium" }]) });
                  }} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4, padding: "5px 10px", background: "none", border: "1px dashed #7F1D1D", borderRadius: 7, cursor: "pointer", color: "#FCA5A5", fontSize: 12, width: "100%" }}>
                    <i className="ti ti-plus" style={{ fontSize: 12 }} /> Add item
                  </button>
                </div>
              </div>

            {/* Milestones */}
            {(d.milestones || []).length > 0 && (
              <div style={{ border: "1px solid #314550", borderRadius: 10, overflow: "hidden", marginBottom: 14 }}>
                <div style={{ padding: "11px 15px", background: "#1A1A1A", borderBottom: "1px solid #314550", display: "flex", alignItems: "center", gap: 8 }}>
                  <i className="ti ti-flag" style={{ color: "#00EDED", fontSize: 14 }} />
                  <span style={{ fontSize: 13, fontWeight: 600, color: "#fff" }}>Milestones</span>
                </div>
                <div style={{ padding: "6px", background: "#0B0D0E" }}>
                  {d.milestones.map(function(ms, i) {
                    const sc = ({ complete: { icon: "ti-circle-check", color: "#00EDED" }, in_progress: { icon: "ti-loader-2", color: "#A2F3F3" }, upcoming: { icon: "ti-clock", color: "#A2F3F3" } })[ms.status] || { icon: "ti-clock", color: "#A2F3F3" };
                    return (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 10px", borderRadius: 7, marginBottom: 2, background: i % 2 === 0 ? "#1A1A1A" : "#0B0D0E" }}>
                        <i className={"ti " + sc.icon} style={{ color: sc.color, fontSize: 14 }} />
                        <span style={{ fontSize: 13, color: "#F4F3F0" }}>{ms.name}</span>
                        {ms.date && <span style={{ marginLeft: "auto", fontSize: 11, color: "#A2F3F3" }}>{ms.date}</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
              <button onClick={generate} disabled={generating}
                style={{ padding: "8px 16px", borderRadius: 8, border: "1px solid #314550", background: "transparent",
                  color: "#A2F3F3", fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
                <i className="ti ti-refresh" /> Regenerate
              </button>
            </div>
          </div>
        );
      }

      return (
        <div>
          {!deck && !generating && <BoardGrid />}
          {generating && (
            <div style={{ padding: "72px 24px", textAlign: "center", color: "#A2F3F3", fontSize: 14 }}>
              <i className="ti ti-loader-2" style={{ fontSize: 36, display: "block", marginBottom: 14, animation: "spin 1s linear infinite", color: "#00EDED" }} />
              Fetching Jira data and generating status deck...
            </div>
          )}
          {deck && !generating && <DeckView d={deck} onBack={function() { setDeck(null); setSelectedBoard(null); setSelectedSprint(null); }} />}
        </div>
      );
    }

    function App() {
      return (
        <div style={{ background: "#053057", border: "0.5px solid #314550", borderRadius: 12, overflow: "hidden" }}>
          <nav style={{ display: "flex", alignItems: "center", background: "#053057", borderBottom: "1px solid #314550" }}>
            <a href="/"
              style={{ display: "flex", alignItems: "center", gap: 7, padding: "12px 18px",
                fontSize: 13, color: "#A2F3F3", textDecoration: "none",
                borderRight: "1px solid #314550", flexShrink: 0 }}>
              <i className="ti ti-home" style={{ fontSize: 15 }} /> Home
            </a>
            <div style={{ display: "flex", alignItems: "center", gap: 7, padding: "10px 18px",
              fontSize: 13, fontWeight: 700, color: "#053057", background: "#FFFFFF",
              margin: "4px 0 4px 8px", borderRadius: 7 }}>
              <i className="ti ti-presentation-analytics" style={{ fontSize: 15 }} /> Status Generator
            </div>
            <div style={{ marginLeft: "auto" }}>
              <img src="/Blend360-Logo.png" alt="Blend360" style={{ height: 22, width: "auto", display: "block", margin: "0 18px", opacity: 0.9 }} />
            </div>
          </nav>
          <StatusGenerator />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <footer class="ld-footer">
    <div class="ld-word" style="font-size: 18px;">DualHat AI<span class="dot">.</span></div>
    <div class="ld-powered"><span>Powered by</span><img class="ld-blendmark" src="/Blend360-Logo.png" alt="Blend360"></div>
  </footer>

  <script>
    (function() {
      var src = document.getElementById("app-src").textContent;
      try {
        var out = Babel.transform(src, {
          presets: [["react", { runtime: "classic" }]],
        }).code;
        (0, eval)(out);
      } catch(e) {
        var r = document.getElementById("root");
        if (r) r.innerHTML = '<div style="max-width:760px;margin:40px auto;padding:20px 24px;border:1px solid #7F1D1D;background:#1a0808;border-radius:12px;font-family:monospace;color:#FCA5A5"><div style="font-weight:600;font-size:15px;margin-bottom:8px">Failed to compile the UI</div><pre style="white-space:pre-wrap;font-size:12px;margin:0;color:#fecaca">' + String(e) + '</pre></div>';
      }
    })();
  </script>
</body>
</html>
